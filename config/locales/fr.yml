fr:
  activerecord:
    models:
      user: compte
      zone: zone
    attributes:
      zone:
        name: Nom
        user: Propriétaire
        crop: Culture
        schedule: Programme d’arrosage
        humidity_threshold: Seuil d’humidité
        temperature_threshold: Seuil de température
        brightness_threshold: Seuil de luminosité
      user:
        email: Adresse e-mail
        username: Nom d’utilisateur
        password: Mot de passe
        password_confirmation: Confirmation du mot de passe
        current_password: Mot de passe actuel
        remember_me: Se souvenir de moi
    errors:
      messages:
        record_invalid: "Validation échouée : %{errors}"
        restrict_dependent_destroy:
          has_one: "Suppression impossible : un élément associé existe."
          has_many: "Suppression impossible : des éléments associés existent."
  errors:
    format: "%{attribute} %{message}"
    messages:
      accepted: doit être accepté
      blank: doit être renseigné
      present: doit être vide
      confirmation: "ne correspond pas à %{attribute}"
      empty: doit être renseigné
      equal_to: "doit être égal à %{count}"
      even: doit être pair
      exclusion: n’est pas disponible
      greater_than: "doit être supérieur à %{count}"
      greater_than_or_equal_to: "doit être supérieur ou égal à %{count}"
      inclusion: ne figure pas dans la liste
      invalid: n’est pas valide
      less_than: "doit être inférieur à %{count}"
      less_than_or_equal_to: "doit être inférieur ou égal à %{count}"
      model_invalid: "Validation échouée : %{errors}"
      not_a_number: doit être un nombre
      not_an_integer: doit être un nombre entier
      odd: doit être impair
      other_than: "doit être différent de %{count}"
      required: doit exister
      taken: est déjà utilisé
      too_long:
        one: "est trop long (maximum : 1 caractère)"
        other: "est trop long (maximum : %{count} caractères)"
      too_short:
        one: "est trop court (minimum : 1 caractère)"
        other: "est trop court (minimum : %{count} caractères)"
      wrong_length:
        one: doit contenir 1 caractère
        other: "doit contenir %{count} caractères"
      already_confirmed: est déjà confirmé
      confirmation_period_expired: "doit être confirmé dans un délai de %{period} ; demandez un nouveau lien"
      expired: a expiré ; demandez un nouveau lien
      not_found: est introuvable
      not_locked: n’est pas verrouillé
      not_saved:
        one: "Une erreur empêche l’enregistrement de ce %{resource} :"
        other: "%{count} erreurs empêchent l’enregistrement de ce %{resource} :"
  date:
    formats:
      default: "%d/%m/%Y"
      short: "%d/%m"
      long: "%d %B %Y"
    day_names: [dimanche, lundi, mardi, mercredi, jeudi, vendredi, samedi]
    abbr_day_names: [dim., lun., mar., mer., jeu., ven., sam.]
    month_names: [null, janvier, février, mars, avril, mai, juin, juillet, août, septembre, octobre, novembre, décembre]
    abbr_month_names: [null, janv., févr., mars, avr., mai, juin, juil., août, sept., oct., nov., déc.]
    order: [day, month, year]
  time:
    formats:
      default: "%d/%m/%Y à %H h %M"
      short: "%d/%m à %H h %M"
      long: "%d %B %Y à %H h %M"
    am: matin
    pm: après-midi
  support:
    array:
      words_connector: ", "
      two_words_connector: " et "
      last_word_connector: " et "
